<svg width="800" height="220" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="220" rx="10" fill="#0d1117" />
  
  <text x="400" y="35" font-family="-apple-system, sans-serif" font-size="14" fill="#8b949e" font-weight="bold" text-anchor="middle">STANDARD SYSTEM ARCHITECTURE</text>

  <!-- Client -->
  <rect x="50" y="80" width="120" height="80" rx="8" fill="#161b22" stroke="#58a6ff" stroke-width="2"/>
  <text x="110" y="115" font-family="sans-serif" font-size="14" fill="#c9d1d9" font-weight="bold" text-anchor="middle">Clients</text>
  <text x="110" y="135" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Web / Flutter / USSD</text>

  <!-- Arrows -->
  <path d="M 170 120 L 250 120" stroke="#484f58" stroke-width="2" stroke-dasharray="4" fill="none" marker-end="url(#arrow)"/>

  <!-- API Gateway -->
  <rect x="250" y="80" width="120" height="80" rx="8" fill="#161b22" stroke="#238636" stroke-width="2"/>
  <text x="310" y="115" font-family="sans-serif" font-size="14" fill="#c9d1d9" font-weight="bold" text-anchor="middle">API Services</text>
  <text x="310" y="135" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Laravel / Express</text>

  <!-- Arrows -->
  <path d="M 370 120 L 450 120" stroke="#484f58" stroke-width="2" stroke-dasharray="4" fill="none" marker-end="url(#arrow)"/>
  
  <path d="M 310 160 L 310 190" stroke="#484f58" stroke-width="2" stroke-dasharray="4" fill="none"/>
  <path d="M 310 190 L 510 190" stroke="#484f58" stroke-width="2" stroke-dasharray="4" fill="none"/>
  <path d="M 510 190 L 510 160" stroke="#484f58" stroke-width="2" stroke-dasharray="4" fill="none" marker-end="url(#arrow)"/>
  
  <!-- Data -->
  <rect x="450" y="80" width="120" height="80" rx="8" fill="#161b22" stroke="#f0883e" stroke-width="2"/>
  <text x="510" y="115" font-family="sans-serif" font-size="14" fill="#c9d1d9" font-weight="bold" text-anchor="middle">Database</text>
  <text x="510" y="135" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">PostgreSQL / SQL</text>
  
  <!-- BI -->
  <path d="M 570 120 L 630 120" stroke="#484f58" stroke-width="2" stroke-dasharray="4" fill="none" marker-end="url(#arrow)"/>

  <rect x="630" y="80" width="120" height="80" rx="8" fill="#161b22" stroke="#a371f7" stroke-width="2"/>
  <text x="690" y="115" font-family="sans-serif" font-size="14" fill="#c9d1d9" font-weight="bold" text-anchor="middle">Analytics</text>
  <text x="690" y="135" font-family="sans-serif" font-size="11" fill="#8b949e" text-anchor="middle">Power BI / Python</text>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#484f58" />
    </marker>
  </defs>
</svg>

<svg width="800" height="200" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200">
  <rect width="800" height="200" rx="10" fill="#0d1117" stroke="#30363d" stroke-width="1" />
  
  <text x="400" y="30" font-family="-apple-system, sans-serif" font-size="14" fill="#8b949e" font-weight="bold" text-anchor="middle">CORE COMPETENCIES</text>
  
  <!-- Frontend -->
  <g transform="translate(60, 60)">
    <rect width="200" height="100" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <text x="100" y="30" font-family="-apple-system, sans-serif" font-size="16" fill="#58a6ff" font-weight="bold" text-anchor="middle">Frontend &amp; Mobile</text>
    <text x="100" y="55" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">React, Next.js, Tailwind</text>
    <text x="100" y="75" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Flutter, Dart</text>
  </g>

  <!-- Backend -->
  <g transform="translate(300, 60)">
    <rect width="200" height="100" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <text x="100" y="30" font-family="-apple-system, sans-serif" font-size="16" fill="#238636" font-weight="bold" text-anchor="middle">Backend API</text>
    <text x="100" y="55" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Laravel, PHP, Node.js</text>
    <text x="100" y="75" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Express, Python</text>
  </g>

  <!-- Data & DevOps -->
  <g transform="translate(540, 60)">
    <rect width="200" height="100" rx="6" fill="#161b22" stroke="#21262d" stroke-width="1" />
    <text x="100" y="30" font-family="-apple-system, sans-serif" font-size="16" fill="#f0883e" font-weight="bold" text-anchor="middle">Data &amp; Infra</text>
    <text x="100" y="55" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">PostgreSQL, MongoDB</text>
    <text x="100" y="75" font-family="sans-serif" font-size="12" fill="#c9d1d9" text-anchor="middle">Docker, Linux, Git</text>
  </g>
</svg>
